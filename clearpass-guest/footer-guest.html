<!--
  Aikchol Guest Wi-Fi — ClearPass Guest Web Login : FOOTER HTML
  วางทั้งไฟล์นี้ในช่อง "Footer HTML" ของ Web Login page เดียวกัน
  (สคริปต์ถูกครอบด้วยแท็ก literal ของ Smarty เพื่อไม่ให้ ClearPass ตีความวงเล็บปีกกา)
-->
{literal}
<script>
(function () {
  var form = document.getElementById('ac-login-form');
  if (!form) return;
  var user = document.getElementById('ac-user');
  var pass = document.getElementById('ac-password');
  var btn = document.getElementById('ac-submit');
  var status = document.getElementById('ac-status');

  // แสดง/ซ่อนรหัสผ่าน
  document.querySelector('.ac-show-password').addEventListener('click', function () {
    var visible = pass.type === 'password';
    pass.type = visible ? 'text' : 'password';
    this.setAttribute('aria-pressed', String(visible));
    this.setAttribute('aria-label', visible ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
  });

  function setError(input, msg) {
    input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    input.parentNode.classList.toggle('is-invalid', !!msg);
    document.getElementById(input.id + '-error').textContent = msg || '';
  }

  function showStatus(msg) {
    status.textContent = msg;
    status.hidden = !msg;
  }

  // ย้ายข้อความ error ที่ ClearPass แสดงเอง (อยู่นอกดีไซน์) มาแสดงในการ์ด
  var cpError = null;
  var candidates = document.querySelectorAll('.nwaError, .nwa_error, .errorMessage, .error, #errmsg');
  for (var i = 0; i < candidates.length; i++) {
    if (!candidates[i].closest('.ac-portal') && candidates[i].textContent.trim()) { cpError = candidates[i]; break; }
  }
  var qsError = (location.search.match(/[?&]errmsg=([^&]*)/) || [])[1];
  if (cpError) {
    showStatus('เข้าสู่ระบบไม่สำเร็จ: ' + cpError.textContent.trim());
    cpError.classList.add('ac-cp-hidden');
  } else if (qsError) {
    showStatus('เข้าสู่ระบบไม่สำเร็จ กรุณาตรวจสอบชื่อผู้ใช้งานและรหัสผ่าน');
  }

  form.addEventListener('submit', function (event) {
    var first = null;
    user.value = user.value.trim();
    setError(user, user.value ? '' : 'กรุณากรอกชื่อผู้ใช้งาน');
    setError(pass, pass.value ? '' : 'กรุณากรอกรหัสผ่าน');
    if (!user.value) first = user; else if (!pass.value) first = pass;
    if (first) { event.preventDefault(); first.focus(); return; }
    showStatus('');
    btn.disabled = true; // กันกดซ้ำ (ค่า submit ส่งผ่าน hidden input แล้ว)
    btn.querySelector('span').textContent = 'กำลังตรวจสอบ...';
  });

  // ถ้าผู้ใช้กด Back กลับมา ให้ปุ่มกลับมากดได้
  window.addEventListener('pageshow', function () {
    btn.disabled = false;
    btn.querySelector('span').textContent = 'เข้าสู่ระบบ';
  });

  [user, pass].forEach(function (input) {
    input.addEventListener('input', function () { setError(input, ''); });
  });

  document.getElementById('ac-year').textContent = new Date().getFullYear();
})();
</script>
{/literal}
